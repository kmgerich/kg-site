name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eleventy-img only skips reprocessing an image when its target file
      # already exists in the output dir (_site/img/... etc, content-hashed
      # by filename) — it has no separate transform cache. Since each
      # deploy starts on a fresh runner with an empty _site/, every one of
      # the ~220 images gets reprocessed into avif/webp/jpeg from scratch,
      # which is the majority of build time (confirmed: ~95s cold vs ~1.5s
      # when _site/ already has the files). Restoring the previous run's
      # _site/ before building lets unchanged images get skipped again.
      # .cache/ (eleventy-fetch's cache for the remote Gravatar images) is
      # cheap to include too. Keyed per-commit with a prefix fallback so
      # each run restores the most recent prior cache.
      - name: Cache built site (eleventy-img output)
        uses: actions/cache@v6
        with:
          path: |
            _site
            .cache
          key: site-build-${{ github.sha }}
          restore-keys: |
            site-build-

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
